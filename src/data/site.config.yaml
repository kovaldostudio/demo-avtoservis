processTitle: "Як проходить ремонт"
process:
  - step: "Запис"
    text: "Обираєте час. На діагностику беремо в день звернення, якщо є вікно."
  - step: "Діагностика"
    text: "40 хвилин. Показуємо, що знайшли, і поясюємо, що критично, а що зачекає."
  - step: "Кошторис"
    text: "Надсилаємо список робіт і сум. Починаємо тільки після вашого «так»."
  - step: "Ремонт"
    text: "Тримаємо в курсі. Якщо зʼявляється щось нове — телефонуємо, а не робимо мовчки."
  - step: "Видача"
    text: "Показуємо зняті деталі, віддаємо акт і гарантійний талон."

testimonialsTitle: "Що кажуть клієнти"
