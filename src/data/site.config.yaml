# ============================================================
#  Єдиний файл, який заповнюється під нового клієнта.
#  Усе інше збирається автоматично.
#  Правило: не лишати жодного поля з прикладу незаповненим —
#  порожні поля помітні на сайті одразу.
# ============================================================

brand:
  name: "Верстак"
  legalName: "Столярна майстерня «Верстак»"
  tagline: "Меблі з масиву на замовлення"
  city: "Київ"
  since: 2017
  # Коротко, одним реченням: що саме робить бізнес і для кого.
  about: >
    Робимо кухні, шафи та корпусні меблі з дуба, ясена і горіха.
    Власне виробництво на Подолі, заміри та проєкт — безкоштовно.

# ——— вигляд ———
# theme:          oak | graphite | linen | ink
# heroVariant:    split | fullbleed | editorial
# catalogVariant: grid | list
theme: graphite
heroVariant: fullbleed
catalogVariant: list

# true  — замість фото акуратні заглушки «Тут буде ваше фото».
#         Режим для вітрини в Instagram і для демо: показує структуру,
#         не використовуючи чужих знімків.
# false — показуються справжні фото з /public/img/.
usePlaceholders: true

seo:
  domain: "verstak.example"
  title: "Меблі з масиву на замовлення в Києві — майстерня «Верстак»"
  description: >
    Кухні, шафи та корпусні меблі з дуба, ясена і горіха. Власне виробництво,
    безкоштовний замір і проєкт, гарантія 3 роки. Розрахунок вартості за день.
  ogImage: "/img/og.jpg"
  locale: "uk_UA"

contacts:
  phone: "+380 67 123 45 67"
  phoneHref: "+380671234567"
  email: "hello@verstak.example"
  instagram: "https://instagram.com/"
  telegram: "https://t.me/"
  address: "Київ, вул. Кирилівська, 41"
  hours: "Пн–Пт 9:00–18:00 · Сб за домовленістю"
  mapUrl: ""

form:
  # URL Cloudflare Worker, який приймає заявку і шле в Telegram.
  endpoint: "https://form.example.workers.dev"
  # Ключ сайту Turnstile. Порожній рядок — захист вимкнено (лише honeypot).
  turnstileSiteKey: ""
  cta: "Розрахувати вартість"
  successText: "Дякуємо. Передзвонимо протягом робочого дня."

hero:
  headline: "Меблі з масиву, які переживуть ремонт"
  sub: >
    Проєктуємо і виготовляємо кухні та шафи з дуба, ясена й горіха.
    Замір і креслення — безкоштовно, вартість знаєте до початку робіт.
  image: "/img/hero.jpg"
  imageAlt: "Кухня з дубового масиву у світлому інтер'єрі"
  points:
    - "Замір і проєкт безкоштовно"
    - "Гарантія 3 роки"
    - "Термін 25–40 днів"

advantages:
  - title: "Власне виробництво"
    text: "Цех на Подолі. Немає посередників — немає націнки за передачу замовлення."
  - title: "Масив, не шпон"
    text: "Дуб, ясен, горіх камерного сушіння. Фурнітура Blum з гарантією виробника."
  - title: "Ціна фіксується в договорі"
    text: "Кошторис узгоджується до початку робіт і не змінюється під час виготовлення."
  - title: "Проєкт за 2 дні"
    text: "Після заміру отримуєте креслення й візуалізацію, а не усну обіцянку."

catalogTitle: "Що робимо"
catalog:
  - name: "Кухні"
    desc: "Корпус — березова фанера, фасади — масив дуба чи ясена. Фурнітура Blum."
    price: "від 14 000 грн / пог. м"
    image: "/img/kitchen.jpg"
    imageAlt: "Кухня з фасадами з дубового масиву"
  - name: "Шафи-купе та гардеробні"
    desc: "Під стелю, з урахуванням нерівних стін. Двері — масив, шпон або дзеркало."
    price: "від 9 000 грн / пог. м"
    image: "/img/wardrobe.jpg"
    imageAlt: "Вбудована гардеробна з дерев'яними фасадами"
  - name: "Столи та стільниці"
    desc: "Обідні столи, письмові, стільниці з цільної ламелі. Олія або лак."
    price: "від 12 000 грн"
    image: "/img/table.jpg"
    imageAlt: "Обідній стіл з масиву горіха"
  - name: "Корпусні меблі"
    desc: "Комоди, тумби, стелажі, ТВ-зони. Проєктуємо під конкретне приміщення."
    price: "від 7 000 грн"
    image: "/img/cabinet.jpg"
    imageAlt: "Стелаж з дерева у вітальні"

processTitle: "Як проходить замовлення"
process:
  - step: "Заявка та розмова"
    text: "Уточнюємо приміщення, бюджет і строк. Одразу кажемо, чи вкладаємось."
  - step: "Замір"
    text: "Майстер приїжджає з лазерним рівнем. Безкоштовно по Києву."
  - step: "Проєкт і кошторис"
    text: "За 2 дні — креслення, візуалізація та фіксована ціна."
  - step: "Виготовлення"
    text: "25–40 днів залежно від складності. Показуємо фото з цеху."
  - step: "Монтаж"
    text: "Встановлюємо, налаштовуємо фурнітуру, прибираємо за собою."

testimonialsTitle: "Відгуки"
testimonials:
  - text: "Кухню робили під нестандартний еркер. Усе стало без щілин, ціна не змінилась."
    author: "Олена"
    detail: "кухня з ясена, Оболонь"
  - text: "Приємно, що присилали фото з цеху. Було видно, що робота йде, а не стоїть."
    author: "Андрій"
    detail: "гардеробна, Печерськ"
  - text: "Порадив сусідам. Через місяць їм зробили таку саму шафу."
    author: "Марина"
    detail: "шафа-купе, Троєщина"

faqTitle: "Питання, які ставлять найчастіше"
faq:
  - q: "Скільки коштує кухня?"
    a: >
      Залежить від породи, фурнітури й довжини. Орієнтир — від 14 000 грн
      за погонний метр. Точну суму називаємо після заміру, до початку робіт.
  - q: "Чи потрібна передоплата?"
    a: "Так, 50% після узгодження проєкту. Решта — після монтажу."
  - q: "Скільки чекати?"
    a: "25–40 днів від узгодження креслень. Термін фіксується в договорі."
  - q: "Працюєте за межами Києва?"
    a: "Так, по області. Замір за межами Києва — платний, сума вираховується з замовлення."
  - q: "Що з гарантією?"
    a: "3 роки на конструкцію і фурнітуру. Дрібні регулювання робимо безкоштовно."

finalCta:
  title: "Порахуємо вашу кухню за день"
  text: "Залиште номер — передзвонимо, уточнимо деталі й запишемо на безкоштовний замір."
