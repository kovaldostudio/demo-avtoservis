faqTitle: "Часті питання"
faq:
  - q: "Скільки триває діагностика?"
    a: >
      Близько 40 хвилин. Якщо несправність плаваюча, можемо попросити лишити авто
      на кілька годин — попередимо заздалегідь і узгодимо.
  - q: "Можна зі своїми запчастинами?"
    a: >
      Так. Гарантія в такому разі поширюється на роботу, а не на саму деталь.
      Це пишемо в акті, щоб не було непорозумінь.
  - q: "Що з гарантією?"
    a: "12 місяців на виконані роботи. На запчастини діє гарантія виробника."
  - q: "Скільки чекати запис?"
    a: "На діагностику зазвичай беремо в день звернення. На великий ремонт — 1–3 дні."
  - q: "Працюєте з юридичними особами?"
    a: "Так, за безготівковим розрахунком, з актами й документами на кожен ремонт."

finalCta:
  title: "Запишемо на діагностику сьогодні"
  text: "Залиште номер і модель авто — передзвонимо, уточнимо симптоми й підберемо час."
